name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 은 번호로 한 그룹이 되어 새 push 가 오면 이전 실행을 취소한다. main push 는 실행마다 자기
  # 그룹(run_id)이라 서로 취소하지 않는다 — 한 그룹 안에서는 대기 중인 실행이 새 실행에 밀려
  # 취소되기 때문이다. 한 번에 여러 커밋을 push 하면 끝 커밋 하나를 검증한다.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI 는 커밋·push 하지 않으므로 git 훅을 설치하지 않는다(husky 문서 "CI server and Docker").
  HUSKY: 0

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # id 변경 판별(ID_TAMPERED, git blame)·피드는 git 전체 이력을 읽는다. 얕은 클론이면
          # validate 가 멈춘다.
          fetch-depth: 0
          persist-credentials: false

      # pnpm 버전은 package.json 의 packageManager 를 따른다.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # package.json engines.node(>=22.13.0) 의 하한 메이저에서 검증한다.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run test:coverage
      - run: pnpm run validate
      - run: pnpm run build
