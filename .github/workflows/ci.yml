name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 은 번호로 한 그룹이 되어 새 push 가 오면 이전 실행을 취소한다. main push 는 실행마다 자기
  # 그룹(run_id)이라 서로 취소하지 않는다 — 한 그룹 안에서는 대기 중인 실행이 새 실행에 밀려
  # 취소되기 때문이다. 한 번에 여러 커밋을 push 하면 끝 커밋 하나를 검증한다.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI 는 커밋·push 하지 않으므로 git 훅을 설치하지 않는다(husky 문서 "CI server and Docker").
  HUSKY: 0

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # id 변경 판별(ID_TAMPERED, git blame)·피드는 git 전체 이력을 읽는다. 얕은 클론이면
          # 문서 집행과 생성의 이력 전제가 충족되지 않는다.
          fetch-depth: 0
          persist-credentials: false

      # pnpm 버전은 package.json 의 packageManager 를 따른다.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # package.json engines.node(>=22.13.0) 의 하한 메이저에서 검증한다.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run test:coverage
      - run: pnpm run build

      - name: Verify prod artifact pair
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readArtifact, SCHEMA_VERSION } from './scripts/lib/artifact.mjs'
          import { loadSchema, validateItem } from './scripts/lib/schema-validator.mjs'
          const expectedSha = process.env.GITHUB_SHA ?? ''
          assert.match(expectedSha, /^[0-9a-f]{40}$/, 'GITHUB_SHA must identify the tested commit')
          const payloads = ['summary', 'feeds'].map(kind => {
            const file = `cache/${kind}.prod.json`
            const result = readArtifact({ expect: { env: 'prod', schemaVersion: SCHEMA_VERSION }, path: file })
            assert.ok(result.fresh, `${file}: ${result.reason}`)
            assert.equal(result.payload.sourceCommit, expectedSha, `${file}: sourceCommit`)
            assert.deepEqual(validateItem(result.payload, loadSchema(`scripts/schema/${kind}.schema.json`), file), [], file)
            return result.payload
          })
          assert.equal(payloads[0].generatedAt, payloads[1].generatedAt, 'prod artifact generatedAt mismatch')
          console.log(`[wiki] prod artifact pair sourceCommit=${expectedSha}`)
          NODE

      - name: Store prod artifact pair
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-prod-${{ github.event_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cache/summary.prod.json
            cache/feeds.prod.json
          archive: true
          overwrite: false
          if-no-files-found: error
